services:
  uptime-kuma:
    image: louislam/uptime-kuma:2  # Tag oficial para usar siempre la última v2 estable (Full Version)
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-prod-data:/app/data
    security_opt:
      - no-new-privileges:true
    restart: always

volumes:
  uptime-kuma-prod-data: